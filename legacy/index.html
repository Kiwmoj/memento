          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);

              node.nodeValue = node.nodeValue.replaceAll(text, replacement);

            const records = JSON.parse(localStorage.getItem(MEMORY_STORAGE_KEY) || '[]');
            return Array.isArray(records) ? records : [];
          } catch {
            return [];

        const loadTasks = () => {
          try {
            const stored = localStorage.getItem(TASK_STORAGE_KEY);

              const records = JSON.parse(stored);

            const initialTasks = starterTasks.map((task) => ({ ...task }));

            return starterTasks.map((task) => ({ ...task }));

              <h3>Search your memories</h3>
              <form class="input-row" data-recall-form>
                <label class="field"><span>What are you looking for?</span><input name="query" type="search" placeholder="Try “passport” or “blue drawer”" autocomplete="off" required /></label>
                <button class="primary-btn" type="submit">Search</button>
              </form>
            </div>
            <div class="task-card">
              <h3>Matches</h3>
              <div class="recall-results" data-recall-results role="status" aria-live="polite"><p class="empty-state">Search item names, locations, notes, or categories.</p></div>
            </div>
          `;

          ['plan', 'trips', 'home', 'people'].forEach((sectionName) => {
            const grid = views.querySelector(`[data-view="${sectionName}"] .task-grid`);
            if (!grid) return;
            grid.innerHTML = `
              <div class="task-board" data-task-list="${sectionName}" aria-live="polite"></div>
              <div class="task-card">
                <h3>Add a task</h3>
                <form class="input-row task-create-form" data-task-form="${sectionName}">
                  <label class="field"><span>Task</span><input name="title" type="text" placeholder="What needs doing?" autocomplete="off" required /></label>
                  <label class="field"><span>Details</span><textarea name="details" rows="2" placeholder="Optional notes"></textarea></label>
                  <label class="field"><span>When</span><input name="due" type="text" placeholder="Today, tomorrow, or a date" /></label>
                  <label class="field"><span>Priority</span><select name="priority"><option>Normal</option><option>High</option><option>Low</option></select></label>
                  <button class="primary-btn" type="submit">Add task</button>
                </form>
              </div>
            `;
          });

          const captureForm = views.querySelector('[data-capture-form]');
          captureForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const form = event.currentTarget;
            const formData = new FormData(form);
            const object = String(formData.get('object') || '').trim();
            const location = String(formData.get('location') || '').trim();
            const reason = String(formData.get('reason') || '').trim();
            const category = String(formData.get('category') || '').trim();
            const feedback = views.querySelector('[data-capture-feedback]');
            if (!object || !location || !category) {
              feedback.textContent = 'Add an item, its location, and a category before saving.';
              return;
            }

            const memory = {
              id: Date.now(),
              object,
              location,
              reason: reason || 'Saved with Memento',
              date: 'No date',
              category,
              color: 'mint',
              pinned: false,
              created: 'Just now'
            };

            try {
              localStorage.setItem(MEMORY_STORAGE_KEY, JSON.stringify([memory, ...readMemories()]));
              sessionStorage.setItem('memento-next-view', 'memories');
              sessionStorage.setItem('memento-notice', `Saved “${object}” to your memories.`);
              window.location.reload();
            } catch {
              feedback.textContent = 'The memory could not be saved in this browser. Check storage settings and try again.';
            }
          });

          const recallForm = views.querySelector('[data-recall-form]');
          const recallInput = recallForm.querySelector('[name="query"]');
          recallForm.addEventListener('submit', (event) => {
            event.preventDefault();
            renderRecallResults(views, recallInput.value);
          });
          runRecallSearch = (query) => {
            if (typeof query === 'string') recallInput.value = query;
            recallForm.requestSubmit();
          };

          views.querySelector('[data-open-memory-library]').addEventListener('click', () => {
            setMementoView?.('memories');
          });

          views.querySelectorAll('[data-task-form]').forEach((form) => {
            form.addEventListener('submit', (event) => {
              event.preventDefault();
              const formData = new FormData(form);
              const title = String(formData.get('title') || '').trim();
              if (!title) return;
              taskItems.unshift({
                id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                section: form.dataset.taskForm,
                title,
                details: String(formData.get('details') || '').trim(),
                due: String(formData.get('due') || '').trim() || 'Unscheduled',
                priority: String(formData.get('priority') || 'Normal'),
                completed: false
              });
              const saved = saveTasks();
              form.reset();
              renderTaskLists(views);
              refreshInteractiveViews();
              const status = document.querySelector('.memento-status');
              if (status) status.textContent = saved ? `Added “${title}” to ${form.dataset.taskForm}.` : 'Task added for this session, but browser storage is unavailable.';

          });

          renderTaskLists(views);
          refreshInteractiveViews();
        };

        const renderRecallResults = (views, query) => {
          const container = views.querySelector('[data-recall-results]');
          const normalized = String(query || '').trim().toLowerCase();
          container.replaceChildren();
          if (!normalized) {
            const message = document.createElement('p');
            message.className = 'empty-state';
            message.textContent = 'Enter a word to search your saved memories.';
            container.appendChild(message);
            return;
          }

          const ignoredWords = new Set(['where', 'what', 'when', 'who', 'have', 'does', 'did', 'put', 'the', 'are', 'was', 'can', 'you', 'your', 'this', 'that', 'with', 'from', 'find', 'show', 'tell', 'about']);
          const terms = normalized.split(/\s+/).filter((term) => term.length > 2 && !ignoredWords.has(term));
          const matches = readMemories().filter((memory) => {
            const searchable = `${memory.object || ''} ${memory.location || ''} ${memory.reason || ''} ${memory.category || ''}`.toLowerCase();
            return searchable.includes(normalized) || terms.some((term) => searchable.includes(term));
          });

          if (!matches.length) {
            const message = document.createElement('p');
            message.className = 'empty-state';
            message.textContent = `No saved memory matched “${query.trim()}”. Try another item, place, or category.`;
            container.appendChild(message);
            return;
          }

          matches.forEach((memory) => {
            const result = document.createElement('article');
            result.className = 'memory-result';
            const header = document.createElement('div');
            header.className = 'memory-result-header';
            const title = document.createElement('h3');
            title.textContent = memory.object || 'Untitled memory';
            const category = document.createElement('span');
            category.className = 'tag';
            category.textContent = memory.category || 'Other';
            header.append(title, category);
            const location = document.createElement('p');
            location.textContent = `Location: ${memory.location || 'Not specified'}`;
            const reason = document.createElement('p');
            reason.textContent = memory.reason || 'No additional note.';
            const openButton = document.createElement('button');
            openButton.type = 'button';
            openButton.className = 'memory-open-button';
            openButton.textContent = 'Open in memory list';
            openButton.addEventListener('click', () => {
              setMementoView?.('memories');
              const mainSearch = document.querySelector('.search-wrap input');
              if (mainSearch) {
                const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
                setter.call(mainSearch, memory.object || '');
                mainSearch.dispatchEvent(new Event('input', { bubbles: true }));
              }
            });
            result.append(header, location, reason, openButton);
            container.appendChild(result);
          });
        };

        const renderTaskLists = (views) => {
          views.querySelectorAll('[data-task-list]').forEach((list) => {
            const sectionName = list.dataset.taskList;
            const records = taskItems.filter((task) => task.section === sectionName);

              const message = document.createElement('p');
              message.className = 'empty-state';

              const checkbox = document.createElement('input');

              checkbox.setAttribute('aria-label', `${task.completed ? 'Reopen' : 'Complete'} ${task.title}`);
              const title = document.createElement('span');
              title.className = 'task-entry-title';
              title.textContent = task.title;
              label.append(checkbox, title);
              const removeButton = document.createElement('button');
              removeButton.type = 'button';
              removeButton.className = 'task-delete';
              removeButton.textContent = 'Delete';
              removeButton.setAttribute('aria-label', `Delete ${task.title}`);
              header.append(label, removeButton);
              entry.appendChild(header);
              if (task.details) {
                const details = document.createElement('p');
                details.textContent = task.details;
                entry.appendChild(details);
              }
              const meta = document.createElement('div');
              meta.className = 'task-entry-meta';
              const due = document.createElement('span');

                taskItems = taskItems.filter((item) => item.id !== task.id);

              list.appendChild(entry);

            } else {
              document.body.appendChild(views);
            }
          }

          placeMementoUI(document.querySelector('main'), tabs, status, views);
          setupInteractiveViews(views);

          const setView = (viewName) => {
            activeMementoView = viewName;
            const allViews = views.querySelectorAll('.memento-view');
            allViews.forEach((view) => view.classList.toggle('active', view.dataset.view === viewName));
            tabs.querySelectorAll('.memento-tab').forEach((tab) => tab.classList.toggle('active', tab.dataset.view === viewName));
            document.querySelectorAll('.market-nav [data-market-view]').forEach((item) => {
              const isActive = item.dataset.marketView === viewName;
              item.classList.toggle('active', isActive);
              if (isActive) item.setAttribute('aria-current', 'page');
              else item.removeAttribute('aria-current');
            });
            document.querySelectorAll('.nav-item[data-memento-menu]').forEach((item) => {
              item.classList.toggle('active', item.dataset.view === viewName);
            });
            const main = document.querySelector('main');
            if (main) {
              main.style.display = 'block';
              main.classList.toggle('memento-task-mode', viewName !== 'memories');
            }
            views.style.display = viewName === 'memories' ? 'none' : 'block';
            syncStatusText(viewName);
          };
          setMementoView = setView;

          const syncStatusText = (view) => {
            if (view === 'capture') status.textContent = 'Capture mode: add the item, where it lives, and why it matters.';
            if (view === 'recall') status.textContent = 'Recall mode: ask for the last place you left something important.';
            if (view === 'plan') status.textContent = 'Plan mode: keep your next task, trip, or errand in one place.';
            if (view === 'trips') status.textContent = 'Trips mode: keep travel docs, itineraries, and packing tasks together.';
            if (view === 'home') status.textContent = 'Home mode: track routines, groceries, and household resets.';
            if (view === 'people') status.textContent = 'People mode: keep follow-ups and shared-item check-ins on track.';
            if (view === 'dashboard') status.textContent = 'Voice input is ready. Tap the mic and say a memory you want to save.';
            if (view === 'memories') status.textContent = 'Memory library: use All memories, Pinned, or a category in the sidebar to filter.';
          };

          tabs.addEventListener('click', (event) => {
            const button = event.target.closest('.memento-tab');
            if (!button) return;
            const view = button.dataset.view;
            setView(view);
          });

          const appMounted = Boolean(document.querySelector('main'));
          const savedView = appMounted ? sessionStorage.getItem('memento-next-view') : null;
          if (appMounted) sessionStorage.removeItem('memento-next-view');
          const initialView = savedView === 'memories' || views.querySelector(`[data-view="${savedView}"]`) ? savedView : 'dashboard';
          setView(initialView);
          const notice = appMounted ? sessionStorage.getItem('memento-notice') : null;
          if (notice) status.textContent = notice;
          if (appMounted) sessionStorage.removeItem('memento-notice');
        };

        const ensureSidebarTabs = () => {
          const navList = document.querySelector('.nav-list');
          if (!navList) return;

          const sidebar = navList.closest('.sidebar');
          if (sidebar && !sidebar.dataset.mementoRoutesPatched) {
            sidebar.dataset.mementoRoutesPatched = 'true';
            sidebar.addEventListener('click', (event) => {
              const item = event.target.closest('.nav-item');
              if (!item || item.dataset.mementoMenu === 'true') return;
              setMementoView?.('memories');
            });
          }

          if (navList.querySelector('[data-memento-menu]')) return;

          const tasks = [
            { label: 'Dashboard', view: 'dashboard', icon: '⌂', count: 'Live' },
            { label: 'Capture', view: 'capture', icon: '✦', count: '0' },
            { label: 'Recall', view: 'recall', icon: '⌁', count: 'Find' },
            { label: 'Plan', view: 'plan', icon: '✓', count: '0' },
            { label: 'Trips', view: 'trips', icon: '✈', count: '0' },
            { label: 'Home', view: 'home', icon: '⌂', count: '0' },
            { label: 'People', view: 'people', icon: '◌', count: '0' }
          ];

          tasks.forEach((task) => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'nav-item';
            item.dataset.mementoMenu = 'true';
            item.dataset.view = task.view;
            item.innerHTML = `
              <span class="nav-icon">${task.icon}</span>
              <span>${task.label}</span>
              <span class="count">${task.count}</span>
            `;
            item.addEventListener('click', () => {
              const matchedTab = document.querySelector(`.memento-tab[data-view="${task.view}"]`);
              if (matchedTab) matchedTab.click();
            });
            navList.appendChild(item);
          });
          document.querySelectorAll('.nav-item[data-memento-menu]').forEach((item) => {
            item.classList.toggle('active', item.dataset.view === activeMementoView);
          });
          updateSidebarCounts();
        };

        const ensureMarketplaceHeader = () => {
          const root = document.getElementById('root');
          const appShell = root?.querySelector('.app-shell');
          if (!root || !appShell || root.querySelector('.market-header')) return;

          const header = document.createElement('header');
          header.className = 'market-header';
          header.innerHTML = `
            <div class="market-header-main">
              <a class="market-brand" href="/" aria-label="Memento dashboard">
                <span class="market-brand-mark" aria-hidden="true">M</span>
                <strong>Memento</strong>
              </a>
              <form class="market-search" data-market-search-form role="search">
                <input type="search" data-market-search aria-label="Search saved memories" placeholder="Search your memories and places" autocomplete="off" />
                <button type="submit">Search</button>
              </form>
              <div class="market-account">
                <div class="market-account-copy"><span>Signed in as</span><strong data-account-name></strong></div>
                <button class="market-signout" type="button" data-sign-out>Sign out</button>
              </div>
            </div>
            <nav class="market-nav" aria-label="Memento sections">
              <button type="button" data-market-view="memories">All memories</button>
              <button type="button" data-market-view="dashboard">Overview</button>
              <button type="button" data-market-view="capture">Capture</button>
              <button type="button" data-market-view="recall">Recall</button>
              <button type="button" data-market-view="plan">Plan</button>
              <button type="button" data-market-view="trips">Trips</button>
              <button type="button" data-market-view="home">Home</button>
              <button type="button" data-market-view="people">People</button>
            </nav>
          `;

          const accountName = header.querySelector('[data-account-name]');
          accountName.textContent = window.MEMENTO_ACCOUNT?.name || 'Memento User';

          header.querySelector('[data-market-search-form]').addEventListener('submit', (event) => {
            event.preventDefault();
            const query = header.querySelector('[data-market-search]').value.trim();
            if (!query) {
              setMementoView?.('memories');
              return;
            }
            setMementoView?.('recall');
            runRecallSearch?.(query);
          });

          header.querySelectorAll('[data-market-view]').forEach((button) => {
            button.addEventListener('click', () => setMementoView?.(button.dataset.marketView));
          });

          header.querySelector('[data-sign-out]').addEventListener('click', async (event) => {
            const button = event.currentTarget;
            button.disabled = true;
            try {
              await fetch('/api/auth/logout', { method: 'POST' });
            } finally {
              window.location.assign('/login');
            }
          });

          root.insertBefore(header, appShell);
          header.querySelectorAll('[data-market-view]').forEach((item) => {
            const isActive = item.dataset.marketView === activeMementoView;
            item.classList.toggle('active', isActive);
            if (isActive) item.setAttribute('aria-current', 'page');
          });
        };

        const patchVoiceButton = () => {
          const voiceButton = document.querySelector('.voice-button');
          if (!voiceButton || voiceButton.dataset.mementoVoicePatched) return;

          voiceButton.dataset.mementoVoicePatched = 'true';
          const inputTarget = document.querySelector('.search-wrap input, .search-wrap textarea, input[type="text"], textarea');

          const handleSpeech = async () => {
            const speechApi = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!speechApi) {
              const msg = 'Voice chat needs Chrome or Safari with microphone access enabled.';
              if (inputTarget) inputTarget.value = msg;
              return;
            }

            const permission = await navigator.mediaDevices?.getUserMedia?.({ audio: true }).catch(() => null);
            if (!permission) {
              const msg = 'Microphone permission is blocked. Please allow access and try again.';
              if (inputTarget) inputTarget.value = msg;
              return;
            }

            permission.getTracks().forEach((track) => track.stop());

            const recognition = new speechApi();
            recognition.lang = 'en-US';
            recognition.interimResults = true;
            recognition.continuous = false;

            voiceButton.classList.add('listening');
            voiceButton.setAttribute('aria-label', 'Listening for your request');

            recognition.onresult = (event) => {
              const transcript = Array.from(event.results)
                .map((result) => result[0]?.transcript || '')
                .join(' ')
                .trim();

              if (transcript && inputTarget) {
                inputTarget.value = transcript;
                inputTarget.dispatchEvent(new Event('input', { bubbles: true }));
                if (activeMementoView === 'recall' && runRecallSearch) runRecallSearch(transcript);
              }
            };

            recognition.onerror = (event) => {
              const errorMessage = event.error === 'not-allowed'
                ? 'Microphone access was denied. Please allow it to keep using voice.'
                : 'I could not hear you clearly. Please try again or type your request instead.';
              if (inputTarget) inputTarget.value = errorMessage;
              voiceButton.classList.remove('listening');
            };

            recognition.onend = () => {
              voiceButton.classList.remove('listening');
              voiceButton.setAttribute('aria-label', 'Ask Memento by voice');
            };

            recognition.start();
          };

          voiceButton.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            handleSpeech();
          });
        };

        const init = () => {
          patchBranding();
          ensureTaskTabs();
          ensureSidebarTabs();
          ensureMarketplaceHeader();
          patchVoiceButton();
          refreshInteractiveViews();
        };

        const observer = new MutationObserver(() => {
          init();
        });

        observer.observe(document.body, { childList: true, subtree: true, attributes: true });
        init();
      })();
    </script>
  </body>
</html>
